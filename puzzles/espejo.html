<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El espejo de Malachar</title>
<style>body{background:#0b0d12;color:#d8d4c8;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:20px}
#word{font-size:2.2em;letter-spacing:.15em;transform:scaleX(-1);border:2px solid #3a3f4a;padding:20px 30px;background:#11141b}
#blanks{font-size:1.6em;letter-spacing:.3em;margin:16px 0}
button{padding:12px 22px;background:#2a2f3a;color:#e8e4d8;border:1px solid #555;border-radius:8px;font-size:1em}</style></head>
<body>
<h2>🪞 El espejo de Malachar</h2>
<p>El espejo muestra una palabra al revés.<br>Léela tú mismo… o gasta hasta <b>3 letras</b> de ayuda.</p>
<div id="word">REFLEJO</div>
<div id="blanks"></div>
<button id="r">💡 Revelar letra</button>
<p><i>Vuelve a Telegram y di la palabra al bot.</i></p>
<script>
var W='REFLEJO',rev=0,b=document.getElementById('blanks'),btn=document.getElementById('r');
function draw(){var s='';for(var i=0;i<W.length;i++){s+=(i<rev?W[i]:'_');if(i<W.length-1)s+=' '}b.textContent=s}
btn.onclick=function(){if(rev<3){rev++;draw();if(rev==3)btn.textContent='💡 Sin más pistas'}};
draw();
</script>
</body></html>
